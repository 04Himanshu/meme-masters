<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guess The Meme Challenge - Official Competition</title>
  <meta name="description" content="Guess iconic dialogues, cinema moments, and viral Bollywood & Indian social media memes within a 60-second timer. The ultimate pop-culture showdown.">
  <meta name="theme-color" content="#050711">

  <!-- Favicon & Web App Manifest -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="favicon.svg">
  <link rel="manifest" href="manifest.json">

  <!-- Open Graph / WhatsApp / Social Share -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Guess The Meme Challenge - Official Competition">
  <meta property="og:description" content="Can you guess famous Bollywood, Indian cinema, and viral internet memes before the 60-second timer runs out?">
  <meta property="og:image" content="https://i.imgflip.com/495470930.jpg">

  <!-- Twitter Meta Tags -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Guess The Meme Challenge - Official Competition">
  <meta name="twitter:description" content="60-second challenge guessing legendary Indian and Bollywood viral memes.">
  <meta name="twitter:image" content="https://i.imgflip.com/495470930.jpg">

  <!-- Google Fonts: Bebas Neue, Cinzel, Montserrat, Inter, JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cinzel:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700&family=Montserrat:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=2.2">
</head>
<body class="on-landing">

  <!-- Top Bar Controls -->
  <header class="landing-top-bar">
    <button id="mic-test-btn" class="mic-test-btn" title="Mic Test" aria-label="Mic Test">
      <svg class="mic-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
        <line x1="12" y1="19" x2="12" y2="22"></line>
      </svg>
      <span class="mic-btn-label">Mic Test</span>
    </button>
  </header>

  <!-- =========================================================================
       Cinematic Landing Page: "Guess the Meme Challenge" Competition Poster
       ========================================================================= -->
  <main id="landing-screen" class="landing-screen" role="main" aria-label="Guess the Meme Challenge Official Competition Poster">
    
    <!-- Ambient Theatrical Lighting & Particle Canvas -->
    <div class="cinematic-backdrop" aria-hidden="true">
      <div class="cinematic-spotlight"></div>
      <div class="cinematic-flare"></div>
      <div class="cinematic-ambient-glow"></div>
      <canvas id="landing-particles" class="particles-canvas"></canvas>
    </div>

    <!-- The 3D Interactive Competition Poster Card -->
    <article id="competition-poster" class="competition-poster" aria-label="Official Competition Poster Card">
      <div class="poster-glare" aria-hidden="true"></div>

      <!-- Poster Vintage Corner Brackets -->
      <div class="poster-corner top-left" aria-hidden="true"></div>
      <div class="poster-corner top-right" aria-hidden="true"></div>
      <div class="poster-corner bottom-left" aria-hidden="true"></div>
      <div class="poster-corner bottom-right" aria-hidden="true"></div>

      <div class="poster-inner">
        <!-- Main Heading: Guess The Meme Challenge -->
        <h1 class="poster-main-title">
          <span class="title-line-1">GUESS THE MEME</span>
          <span class="title-line-2">CHALLENGE</span>
        </h1>

        <!-- The Big "Start" Button -->
        <button id="start-challenge-btn" class="cinematic-start-btn" aria-label="Start Guess the Meme Challenge">
          <span class="btn-glow-aura" aria-hidden="true"></span>
          <span class="btn-sheen" aria-hidden="true"></span>
          <span class="btn-inner">
            <span class="btn-play-icon" aria-hidden="true">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
                <polygon points="6 3 20 12 6 21 6 3"></polygon>
              </svg>
            </span>
            <span class="btn-text">START</span>
          </span>
        </button>
      </div>
    </article>
  </main>

  <!-- Audio in assets -->
  <audio id="meme-audio" src="assets/audio/nocopyright-meme.mp3" preload="auto"></audio>
  <audio id="mic-test-audio" src="assets/audio/mic_test.mpeg" preload="auto"></audio>

  <!-- Sound Controller & Interactive Landing Page Scripts -->
  <script src="js/audio.js?v=2.2"></script>
  <script src="js/app.js?v=2.2"></script>
</body>
</html>
